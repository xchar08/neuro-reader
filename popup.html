<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroReader Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>NeuroReader</h1>
      <p class="subtitle">Focus & Accessibility Manager</p>
      
      <!-- Master Toggle Switch -->
      <div class="toggle-container">
        <label class="switch">
          <input type="checkbox" id="masterToggle">
          <span class="slider round"></span>
        </label>
        <span id="toggleStatus">Enabled</span>
      </div>
    </header>

    <main id="mainContent">
      <!-- Current Site Action -->
      <section class="current-site-section">
        <button id="blacklistCurrentBtn" class="btn btn-primary">
          <span class="icon">🚫</span> Blacklist Current Site
        </button>
      </section>

      <div class="divider"><span>OR</span></div>

      <!-- Manual Entry -->
      <section class="input-group">
        <input type="text" id="blacklistInput" placeholder="e.g. facebook.com" autocomplete="off">
        <button id="addButton" class="btn btn-secondary" title="Add to list">+</button>
      </section>

      <!-- List -->
      <section class="list-section">
        <h3>Blocked Sites</h3>
        <ul id="blacklistItems" class="site-list">
          <!-- Items injected here by JS -->
        </ul>
        <div id="emptyState" class="empty-state hidden">
          No websites blocked yet.
        </div>
      </section>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>

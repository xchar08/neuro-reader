name: Build and Release Neuro Reader Chrome Extension

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Build extension
        run: npm run build

      - name: Release
        run: npm run release
